name: Template checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: pnpm lint
      - run: pnpm -r --if-present type-check
      - run: pnpm --filter @better-stack-monorepo/common typecheck
      - run: pnpm --filter mobile-app exec expo install --check
